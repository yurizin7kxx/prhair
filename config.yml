backend:
  name: github
  repo: yurizin7kxx/prhair
  branch: main
  base_url: https://decap-cms-oauth.vercel.app
  auth_endpoint: /auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "produtos"
    label: "Produtos"
    folder: "conteudo/produtos"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nome do Produto", name: "title", widget: "string" }
      - { label: "Preço", name: "preco", widget: "string" }
      - { label: "Categoria", name: "categoria", widget: "string" }
      - { label: "Imagem", name: "image", widget: "image" }
      - { label: "Descrição", name: "body", widget: "markdown" }