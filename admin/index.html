<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Administrativo - PR Cosméticos</title>
  <!-- Link explícito para o ficheiro de configuração -->
  <link href="config.yml" type="text/yaml" rel="cms-config-url" />
  <!-- Widget de Autenticação -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<!-- Biblioteca para ler o formato YAML dos ficheiros do CMS -->
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

<script>
  async function carregarProdutos() {
    const grid = document.getElementById('produtos-grid');
    if (!grid) return;

    grid.innerHTML = '<p style="color: var(--muted);">A carregar produtos...</p>';

    try {
      // Usamos a branch main e o caminho correto do repositório
      const response = await fetch('https://api.github.com/repos/yurizin7kxx/prhair/contents/conteudo/produtos', {
        headers: {
          'Accept': 'application/vnd.github.v3+json'
        }
      });
      
      if (!response.ok) {
        grid.innerHTML = '<p style="color: var(--muted);">Ainda não há produtos cadastrados.</p>';
        return;
      }

      const files = await response.json();
      grid.innerHTML = '';

      let total = 0;

      for (const file of files) {
        if (file.name.endsWith('.md')) {
          total++;
          const res = await fetch(file.download_url);
          const rawText = await res.text();

          const match = rawText.match(/^---\r?\n([\s\S]*?)\r?\n---/);
          
          let title = 'Produto';
          let preco = '0,00';
          let categoria = '';
          let image = '';

          if (match && match[1]) {
            const data = jsyaml.load(match[1]);
            title = data.title || title;
            preco = data.preco || preco;
            categoria = data.categoria || '';
            image = data.image || '';
          }

          if (image.startsWith('/')) {
            image = image.substring(1);
          }

          const card = document.createElement('article');
          card.className = 'card';
          card.innerHTML = `
            <div class="tile t1">
              ${image ? `<img src="${image}" alt="${title}" onerror="this.style.display='none'">` : ''}
              ${categoria ? `<span class="tag">${categoria}</span>` : ''}
            </div>
            <h3>${title}</h3>
            <div class="price">R$ ${preco}</div>
            <a class="btn" target="_blank" rel="noopener" href="https://wa.me/5588997858642?text=Ol%C3%A1%21%20Tenho%20interesse%20no%20produto%3A%20${encodeURIComponent(title)}">Encomendar</a>
          `;
          grid.appendChild(card);
        }
      }

      if (total === 0) {
        grid.innerHTML = '<p style="color: var(--muted);">Nenhum produto encontrado na pasta.</p>';
      }

    } catch (err) {
      console.error(err);
      grid.innerHTML = '<p style="color: var(--muted);">Erro ao sincronizar produtos.</p>';
    }
  }

  document.addEventListener('DOMContentLoaded', carregarProdutos);
</script>
<body>
  <!-- Script do Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
