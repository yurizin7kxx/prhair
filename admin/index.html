<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Administrativo - PR Cosméticos</title>
  <!-- Link explícito para o ficheiro de configuração -->
  <link href="config.yml" type="text/yaml" rel="cms-config-url" />
  <!-- Widget de Autenticação -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<!-- Biblioteca para ler o formato YAML dos ficheiros do CMS -->
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

<script>
  async function carregarProdutos() {
    const grid = document.getElementById('produtos-grid');
    if (!grid) return;

    grid.innerHTML = '<p style="color: var(--muted);">A carregar produtos...</p>';

    try {
      // Procura a lista de ficheiros na pasta de produtos do GitHub
      const response = await fetch('https://api.github.com/repos/yurizin7kxx/prhair/contents/conteudo/produtos');
      
      if (!response.ok) {
        grid.innerHTML = '<p>Nenhum produto cadastrado ainda.</p>';
        return;
      }

      const files = await response.json();
      grid.innerHTML = '';

      let produtosEncontrados = 0;

      for (const file of files) {
        if (file.name.endsWith('.md')) {
          produtosEncontrados++;
          const res = await fetch(file.download_url);
          const rawText = await res.text();

          // Extrai o bloco YAML entre os marcadores ---
          const match = rawText.match(/^---\r?\n([\s\S]*?)\r?\n---/);
          if (match && match[1]) {
            const data = jsyaml.load(match[1]);

            const title = data.title || 'Produto sem nome';
            const preco = data.preco || '0,00';
            const categoria = data.categoria || '';
            const image = data.image || '';

            // Cria o cartão do produto
            const card = document.createElement('article');
            card.className = 'card';
            card.innerHTML = `
              <div class="tile t1">
                ${image ? `<img src="${image}" alt="${title}">` : ''}
                ${categoria ? `<span class="tag">${categoria}</span>` : ''}
              </div>
              <h3>${title}</h3>
              <div class="price">R$ ${preco}</div>
              <a class="btn" target="_blank" rel="noopener" href="https://wa.me/5588997858642?text=Ol%C3%A1%21%20Tenho%20interesse%20no%20produto%3A%20${encodeURIComponent(title)}">Encomendar</a>
            `;
            grid.appendChild(card);
          }
        }
      }

      if (produtosEncontrados === 0) {
        grid.innerHTML = '<p>Nenhum produto encontrado.</p>';
      }

    } catch (error) {
      console.error('Erro ao carregar produtos:', error);
      grid.innerHTML = '<p>Erro ao carregar os produtos.</p>';
    }
  }

  document.addEventListener('DOMContentLoaded', carregarProdutos);
</script>
<body>
  <!-- Script do Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
