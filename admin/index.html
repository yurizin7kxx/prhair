<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Administrativo - PR Cosméticos</title>
  <!-- Link explícito para o ficheiro de configuração -->
  <link href="config.yml" type="text/yaml" rel="cms-config-url" />
  <!-- Widget de Autenticação -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<script>
  // Função para carregar os produtos salvos pelo Decap CMS
  async function carregarProdutos() {
    const grid = document.getElementById('produtos-grid');
    if (!grid) return;

    try {
      // Procura a lista de ficheiros na pasta do GitHub
      const response = await fetch('https://api.github.com/repos/yurizin7kxx/prhair/contents/conteudo/produtos');
      
      if (!response.ok) {
        grid.innerHTML = '<p>Nenhum produto encontrado.</p>';
        return;
      }

      const files = await response.json();
      grid.innerHTML = '';

      for (const file of files) {
        if (file.name.endsWith('.md')) {
          const res = await fetch(file.download_url);
          const text = await res.text();

          // Extrai as informações do produto
          const title = text.match(/title:\s*"(.*?)"/)?.[1] || text.match(/title:\s*(.*)/)?.[1] || '';
          const preco = text.match(/preco:\s*"(.*?)"/)?.[1] || text.match(/preco:\s*(.*)/)?.[1] || '';
          const categoria = text.match(/categoria:\s*"(.*?)"/)?.[1] || text.match(/categoria:\s*(.*)/)?.[1] || '';
          const image = text.match(/image:\s*"(.*?)"/)?.[1] || text.match(/image:\s*(.*)/)?.[1] || '';

          // Cria o cartão do produto no HTML
          const card = document.createElement('article');
          card.className = 'card';
          card.innerHTML = `
            <div class="tile t1">
              ${image ? `<img src="${image}" alt="${title}">` : ''}
              ${categoria ? `<span class="tag">${categoria}</span>` : ''}
            </div>
            <h3>${title}</h3>
            <div class="price">R$ ${preco}</div>
            <a class="btn" target="_blank" rel="noopener" href="https://wa.me/5588997858642?text=Ol%C3%A1%21%20Tenho%20interesse%20no%20produto%3A%20${encodeURIComponent(title)}">Encomendar</a>
          `;
          grid.appendChild(card);
        }
      }
    } catch (error) {
      console.error('Erro ao carregar produtos:', error);
    }
  }

  // Executa ao carregar a página
  document.addEventListener('DOMContentLoaded', carregarProdutos);
</script>
<body>
  <!-- Script do Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
